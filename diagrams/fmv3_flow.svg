<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1036" viewBox="0 0 1240 1036">
<rect width="1240" height="1036" fill="#ffffff"/>
<text x="24" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Face Motion v3 — connection flows (contract revision 5)</text>
<text x="24" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">[n] = message type number.  Blue: receiver (PC) → iOS.  Green: iOS → receiver.  UDP is recommended; TCP is the alternative.</text>
<rect x="24" y="88" width="590" height="410" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="24" y="88" width="590" height="38" rx="10" fill="#e5e7eb"/>
<rect x="24" y="116" width="590" height="10" fill="#e5e7eb"/>
<text x="40" y="113" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">UDP · normal start (PC starts)</text>
<text x="134" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Receiver (PC)</text>
<text x="134" y="167" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">binds UDP 49983</text>
<text x="504" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">iOS app</text>
<text x="504" y="167" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">UDP 49983 (all three apps)</text>
<line x1="134" y1="178" x2="134" y2="484" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="504" y1="178" x2="504" y2="484" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="134" y1="208" x2="495" y2="208" stroke="#1d4ed8" stroke-width="2.4"/>
<path d="M504,208 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="319.0" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">HELLO [1]</text>
<text x="319.0" y="225" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">client_nonce in session_id; same HELLO every 1 s, 5 times at most</text>
<line x1="504" y1="268" x2="143" y2="268" stroke="#047857" stroke-width="2.4"/>
<path d="M134,268 l12,-6 v12 z" fill="#047857"/>
<text x="319.0" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">SCHEMA [2]</text>
<text x="319.0" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">about 3 datagrams of ≤ 576 B; returns the HELLO&#x27;s client_nonce</text>
<line x1="134" y1="328" x2="495" y2="328" stroke="#1d4ed8" stroke-width="2.4"/>
<path d="M504,328 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="319.0" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">SCHEMA_ACK [3]</text>
<text x="319.0" y="345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">after the whole schema is valid and stored</text>
<line x1="504" y1="388" x2="143" y2="388" stroke="#047857" stroke-width="2.4"/>
<path d="M134,388 l12,-6 v12 z" fill="#047857"/>
<text x="319.0" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">FRAME [4] …</text>
<text x="319.0" y="405" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">numbers only, in schema order</text>
<line x1="134" y1="448" x2="495" y2="448" stroke="#1d4ed8" stroke-width="2.4"/>
<path d="M504,448 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="319.0" y="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">PING [6] every 3 s  /  PONG [7] back</text>
<text x="319.0" y="465" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">keeps the session alive</text>
