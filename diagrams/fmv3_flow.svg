<path d="M504,638 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="319.0" y="630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">TCP connect</text>
<text x="319.0" y="655" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">3 s per attempt, 5 attempts</text>
<line x1="134" y1="698" x2="495" y2="698" stroke="#1d4ed8" stroke-width="2.4"/>
<path d="M504,698 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="319.0" y="690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">HELLO [1]</text>
<text x="319.0" y="715" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">right after connecting, on the same connection</text>
<line x1="504" y1="758" x2="143" y2="758" stroke="#047857" stroke-width="2.4"/>
<path d="M134,758 l12,-6 v12 z" fill="#047857"/>
<text x="319.0" y="750" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">SCHEMA [2]</text>
<text x="319.0" y="775" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">within 5 s of connecting</text>
<line x1="504" y1="818" x2="143" y2="818" stroke="#047857" stroke-width="2.4"/>
<path d="M134,818 l12,-6 v12 z" fill="#047857"/>
