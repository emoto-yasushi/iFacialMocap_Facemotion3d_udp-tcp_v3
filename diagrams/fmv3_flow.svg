<text x="319.0" y="835" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">no SCHEMA_ACK on TCP</text>
<line x1="134" y1="878" x2="495" y2="878" stroke="#1d4ed8" stroke-width="2.4"/>
<path d="M504,878 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="319.0" y="870" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">PING [6] every 3 s  /  PONG [7] back</text>
<text x="319.0" y="895" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">keeps the session alive</text>
