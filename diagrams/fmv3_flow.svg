<path d="M1106,388 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="921.0" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">PING [6] every 3 s  /  PONG [7] back</text>
<text x="921.0" y="405" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">keeps the session alive</text>
