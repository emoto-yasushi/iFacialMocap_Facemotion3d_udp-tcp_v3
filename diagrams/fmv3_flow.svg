<path d="M1106,268 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="921.0" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">SCHEMA_ACK [3]</text>
<text x="921.0" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">to the sender&#x27;s address and port</text>
