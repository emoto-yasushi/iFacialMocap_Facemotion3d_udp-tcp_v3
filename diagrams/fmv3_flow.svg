<rect x="626" y="518" width="590" height="38" rx="10" fill="#e5e7eb"/>
<rect x="626" y="546" width="590" height="10" fill="#e5e7eb"/>
<text x="642" y="543" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">TCP · manual start (iOS starts)</text>
<text x="736" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Receiver (PC)</text>
<text x="736" y="597" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">listens on TCP 49984</text>
<text x="1106" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">iOS app</text>
<text x="1106" y="597" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">user entered the PC address</text>
<line x1="736" y1="608" x2="736" y2="914" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="1106" y1="608" x2="1106" y2="914" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="1106" y1="638" x2="745" y2="638" stroke="#047857" stroke-width="2.4"/>
<path d="M736,638 l12,-6 v12 z" fill="#047857"/>
<text x="921.0" y="630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">TCP connect</text>
<text x="921.0" y="655" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">a new connection is a new session</text>
<line x1="1106" y1="698" x2="745" y2="698" stroke="#047857" stroke-width="2.4"/>
<path d="M736,698 l12,-6 v12 z" fill="#047857"/>
<text x="921.0" y="690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">SCHEMA [2]</text>
<text x="921.0" y="715" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">client_nonce = 0</text>
<line x1="1106" y1="758" x2="745" y2="758" stroke="#047857" stroke-width="2.4"/>
<path d="M736,758 l12,-6 v12 z" fill="#047857"/>
<text x="921.0" y="750" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">FRAME [4] …</text>
<text x="921.0" y="775" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">no SCHEMA_ACK on TCP</text>
<line x1="736" y1="818" x2="1097" y2="818" stroke="#1d4ed8" stroke-width="2.4"/>
<path d="M1106,818 l-12,-6 v12 z" fill="#1d4ed8"/>
<text x="921.0" y="810" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">PING [6] every 3 s  /  PONG [7] back</text>
<text x="921.0" y="835" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">keeps the session alive</text>
<text x="24" y="958" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">No new FRAME for 3 s → repair up to 3 times: SCHEMA_ACK again (UDP) + GET_SCHEMA [5]. After 12 s → WAITING: the port stays open and timers send nothing.</text>
<text x="24" y="984" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">STOP [8] goes only from the receiver (PC) to iOS.  When iOS stops, FRAMEs just stop (over TCP the connection closes).</text>
<text x="24" y="1010" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">ERROR [9] carries a refusal or error text, e.g. BUSY or UNSUPPORTED_CONTRACT.  PROTOCOL_V3.md is the definition.</text>
</svg>
