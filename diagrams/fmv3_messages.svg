<text x="704.0" y="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">24 · UInt16 · 0–4096 / 52</text>
<rect x="794" y="514" width="422" height="62" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="1005.0" y="539" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">variable-mode strings only</text>
<text x="1005.0" y="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">app/profile: UInt16 length; names: UInt8 length</text>
<text x="24" y="605" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">Variable-mode strings: length, then UTF-8 bytes; the last name ends exactly at the end of the payload. UDP SCHEMA parts ≤ 576 B; fixed52 uses one part.</text>
<text x="24" y="627" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">Fixed52: mode 1, blend_encoding 2 (i32), blend_count 52, schema_id 1. No names or app/profile strings; no schema or mode change within the session.</text>
<text x="24" y="676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">FRAME [4] payload — N = blend_count (variable) or 52 (fixed52)</text>
<rect x="24" y="686" width="560" height="62" fill="#dbeafe" stroke="#9ca3af"/>
<text x="304.0" y="711" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">N BlendShape integers</text>
<text x="304.0" y="732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">variable: i16 2N B / i32 4N B · fixed52: 52 × Int32 = 208 B · percent (-25 = -0.25)</text>
<rect x="584" y="686" width="300" height="62" fill="#d1fae5" stroke="#9ca3af"/>
<text x="734.0" y="711" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">head · 24 B</text>
<text x="734.0" y="732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">rx ry rz (deg) px py pz (m) · 6 × Float32</text>
<rect x="884" y="686" width="156" height="62" fill="#d1fae5" stroke="#9ca3af"/>
<text x="962.0" y="711" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">right eye · 12 B</text>
<text x="962.0" y="732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">rx ry rz · 3 × Float32</text>
<rect x="1040" y="686" width="160" height="62" fill="#d1fae5" stroke="#9ca3af"/>
<text x="1120.0" y="711" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">left eye · 12 B</text>
<text x="1120.0" y="732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">rx ry rz · 3 × Float32</text>
<text x="24" y="776" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">Head + eyes = 12 × Float32 = 48 B (&quot;&lt;12f&quot;). Variable 52 × i16: 40 + 104 + 48 = 192 B; fixed52: 40 + 208 + 48 = 296 B (one datagram).</text>
<text x="24" y="798" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">Fixed52 payload offsets: BlendShapes 0, head 208, right eye 232, left eye 244. sequence counts frames; skip duplicates and older frames.</text>
<rect x="24" y="838" width="1192" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="620.0" y="863" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">GET_SCHEMA [5] · PING [6] · PONG [7] · STOP [8]: header only. ERROR [9]: 1–512 bytes of UTF-8 text.</text>
<text x="24" y="932" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">Both modes need validation and PING/PONG (UDP and TCP); UDP also needs SCHEMA_ACK. Revision 5 is incompatible; update both sides.</text>
<text x="24" y="980" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">PROTOCOL_V3.md is the definition; golden_vectors.c lists the exact bytes in C99 (optional, for development; never sent on the network).</text>
</svg>
