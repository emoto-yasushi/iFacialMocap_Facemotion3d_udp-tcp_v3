<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820">
<rect width="1240" height="820" fill="#ffffff"/>
<text x="24" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Face Motion v3 — message layout (contract revision 5)</text>
<text x="24" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">Little-endian, no padding. Offset · size. Every message = 40-byte header + payload.</text>
<text x="24" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Common header (40 bytes)   Python: struct &quot;&lt;4sBBHQIIIIHHI&quot;</text>
