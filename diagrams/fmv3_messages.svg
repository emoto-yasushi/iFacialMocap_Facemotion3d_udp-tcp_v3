<text x="24" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Face Motion v3 — message layout (contract revision 6)</text>
<text x="24" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">Little-endian, no padding. Box text: offset · size or type. Every message = 40-byte header + payload. No JSON on the wire.</text>
<text x="24" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Common header (40 bytes)   Python: struct &quot;&lt;4sBBHQIIIIHHI&quot;</text>
